<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay AW Go Travel</title><script src="https://js.stripe.com/clover/stripe.js"></script><link rel="stylesheet" href="/payment-theme.css"></head>
<body class="checkout-page"><main class="checkout-layout">
<section class="checkout-summary"><a class="checkout-brand" href="/"><img src="/favicon.png" alt=""><span>AW Go Travel</span></a><h1>Amount</h1><div class="amount-display" id="amount-display">0,00 US$</div><input id="amount" class="amount-input" type="number" min="5" max="200" step="1" inputmode="numeric" aria-label="Payment amount in USD" autofocus></section>
<section class="checkout-panel"><h2>Pay with Cash App</h2><form id="payment-form">
<div class="checkout-field"><label for="email">Email</label><input id="email" type="email" required maxlength="254" autocomplete="email" placeholder="email@example.com"></div>
<div class="checkout-field"><label for="name">Full name</label><input id="name" required maxlength="120" autocomplete="name"></div><p class="section-title">Payment method</p>
<div class="cash-card"><div class="cash-heading"><span class="cash-icon">$</span><strong>Cash App Pay</strong></div><div class="cash-copy"><svg viewBox="0 0 48 40" aria-hidden="true"><path opacity=".58" fill-rule="evenodd" d="M9 1a4 4 0 0 0-4 4v30a4 4 0 0 0 4 4h18a4 4 0 0 0 4-4v-9a1 1 0 1 0-2 0v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V14a2 2 0 0 1 2-2h18a2 2 0 0 1 2 2v2a1 1 0 1 0 2 0V5a4 4 0 0 0-4-4H9Zm26.99 15.41L39.58 20H24a1 1 0 1 0 0 2h15.58l-3.59 3.59a1 1 0 1 0 1.42 1.42l5.3-5.3a1 1 0 0 0 0-1.42l-5.3-5.3a1 1 0 1 0-1.42 1.42Z"/></svg><span>A QR code will appear for you to scan with Cash App Pay.</span></div></div><div id="stripe-engine" aria-hidden="true"></div>
<label class="terms"><input id="terms" type="checkbox" required><span>I agree to the <a href="/terms" target="_blank">Terms</a>, <a href="/privacy" target="_blank">Privacy Policy</a>, and <a href="/refund-policy" target="_blank">Refund Policy</a>.</span></label>
<label class="terms"><input id="work-approved" type="checkbox" required><span>I approve the agreed work and authorize this payment.</span></label><details class="consent-details"><summary>Details</summary><p>I confirm that the agreed work was presented to me, that I approved it, and that I authorize this payment.</p></details>
<button id="submit" type="submit" disabled>Continue</button><div id="message" class="message" role="status"></div><div id="suggestions" class="suggestions"></div></form><div class="checkout-footer">Powered by <b>stripe</b><span>|</span><a href="/terms">Terms</a><a href="/privacy">Privacy</a></div></section></main>
<script>
const form=document.getElementById('payment-form'),amount=document.getElementById('amount'),display=document.getElementById('amount-display'),email=document.getElementById('email'),nameField=document.getElementById('name'),submit=document.getElementById('submit'),message=document.getElementById('message'),suggestions=document.getElementById('suggestions'),engine=document.getElementById('stripe-engine');let timer,controller,actions,signature='';
const money=v=>v?`${new Intl.NumberFormat('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v))} US$`:'0,00 US$';
const payload=()=>({amount:Number(amount.value),name:nameField.value.trim(),email:email.value.trim(),termsAccepted:document.getElementById('terms').checked,workApproved:document.getElementById('work-approved').checked});
const valid=()=>Number.isInteger(Number(amount.value))&&Number(amount.value)>=5&&Number(amount.value)<=200&&/^\S+@\S+\.\S+$/.test(email.value)&&nameField.value.trim().length>=2&&document.getElementById('terms').checked&&document.getElementById('work-approved').checked;
function note(t=''){message.textContent=t;message.className='message'}function reset(){if(controller)controller.abort();clearTimeout(timer);actions=null;signature='';engine.replaceChildren();suggestions.replaceChildren();note();submit.disabled=true;submit.textContent='Continue';if(valid())timer=setTimeout(prepare,550)}
async function json(url,options={}){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw d;return d}
async function prepare(){controller=new AbortController();submit.textContent='Preparing…';note('Preparing secure payment…');try{const request=payload();signature=JSON.stringify(request);const session=await json('/api/checkout/session',{method:'POST',headers:{'content-type':'application/json'},body:signature,signal:controller.signal});const [state,config]=await Promise.all([json(`/api/checkout/client-secret?session_id=${encodeURIComponent(session.stripeCheckoutSessionId)}`,{signal:controller.signal}),json('/api/stripe/config',{signal:controller.signal})]);const sdk=Stripe(config.publishableKey).initCheckoutElementsSdk({clientSecret:state.clientSecret,elementsOptions:{appearance:{theme:'stripe',variables:{colorPrimary:'#0570de',borderRadius:'6px',fontFamily:'-apple-system,system-ui,"Segoe UI",Roboto,sans-serif'}}}});sdk.createPaymentElement({layout:{type:'accordion',defaultCollapsed:false}}).mount(engine);const loaded=await sdk.loadActions();if(loaded.type==='error')throw new Error(loaded.error.message);actions=loaded.actions;if(signature===JSON.stringify(payload())){note();submit.textContent='Continue';submit.disabled=false}}catch(e){if(e.name==='AbortError')return;note(e.error||e.message||'Unable to prepare payment. Please try again.');for(const v of e.suggestions||[]){const b=document.createElement('button');b.type='button';b.textContent=`$${v}`;b.onclick=()=>{amount.value=v;display.textContent=money(v);reset()};suggestions.appendChild(b)}submit.textContent='Continue'}finally{controller=null}}
display.addEventListener('click',()=>amount.focus());form.addEventListener('input',reset);amount.addEventListener('input',()=>display.textContent=money(amount.value));form.addEventListener('submit',async e=>{e.preventDefault();if(!actions)return;submit.disabled=true;submit.textContent='Processing…';note();const result=await actions.confirm();if(result.type==='error'){note(result.error.message||'Unable to complete payment.');submit.disabled=false;submit.textContent='Continue'}})
</script></body></html>
