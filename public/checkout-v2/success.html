<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status</title><link rel="stylesheet" href="/payment-theme.css"><style>.card{width:min(100%,480px);padding:34px;text-align:center}.check{width:70px;height:70px;border:4px solid #45d483;border-radius:50%;display:grid;place-items:center;color:#45d483;font-size:38px;margin:0 auto 22px}h1{margin:0 0 10px}.error{color:var(--danger)}</style></head><body><main class="card"><div class="check">✓</div><h1 id="title">Confirming payment…</h1><p id="message">Please wait while Stripe confirms your payment.</p></main><script>const params=new URLSearchParams(location.search);const sessionId=params.get('session_id');const title=document.getElementById('title');const message=document.getElementById('message');async function verify(){if(!sessionId)throw new Error('Payment reference is missing.');const response=await fetch(`/api/checkout/status?session_id=${encodeURIComponent(sessionId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error);if(data.paymentStatus==='paid'){title.textContent='Payment completed';message.textContent='Your payment was processed successfully. Your paid invoice is now available.'}else if(data.paymentStatus==='expired'){title.textContent='Payment expired';message.textContent='No completed payment or invoice was recorded.'}else{title.textContent='Payment not completed';message.textContent='Stripe has not marked this payment as paid. No invoice has been created.'}}verify().catch(error=>{title.textContent='Unable to confirm payment';message.textContent=error.message;message.className='error'});</script></body></html>
